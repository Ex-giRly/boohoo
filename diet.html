<!DOCTYPE html>
<html>

<head>
    <title>Cascading Effects h2h</title>
    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
        }

        p {
            color: deeppink;
            font-size: 18px;
        }

        .special {
            color: purple;
        }

        .force {
            color: white !important;
            background-color: hotpink;
        }
    </style>
</head>

<body>
    <h1>CSS Cascading effect💗</h1>
    <p>This text is styled by the p selector.</p>
    <p class="special">This text is styled by the .special class.</p>
    <p style="color: crimson;">This text is styled by inline CSS.</p>
    <p class="force" style="color: black;">This text uses !important to override everything.</p>
</body>

</html>
